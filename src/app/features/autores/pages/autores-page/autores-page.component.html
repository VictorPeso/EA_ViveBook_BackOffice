<section class="autores-page">
  <div class="autores-page__layout">
    @if (isAdmin()) {
      <aside class="autores-page__form-column">
        <app-autor-form
          [autor]="selectedAutor()"
          [isSaving]="isSaving()"
          [isDeleting]="isDeleting()"
          [isCreating]="isCreating()"
          [errorMessage]="errorMessage()"
          [successMessage]="successMessage()"
          (save)="onSaveAutor($event)"
          (delete)="onDeleteAutor($event)"
          (cancel)="onCancelEdit()"
          (restoreAutor)="onRestore($event)"
        >
        </app-autor-form>
      </aside>
    }

    <section class="autores-page__list-column" [style.grid-column]="isAdmin() ? '' : '1 / -1'">
      <app-autores-list
        [autores]="autores()"
        [selectedAutorId]="selectedAutor()?._id ?? null"
        [isLoading]="isLoading()"
        [isAdmin]="isAdmin()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectAutor)="onSelectAutor($event)"
        (createNew)="onCreateNew()"
        (pageChange)="onPageChange($event)"
        (nextPage)="onNextPage()"
        (previousPage)="onPreviousPage()"
        (search)="onSearch($event)"
      >
      </app-autores-list>
    </section>
  </div>
</section>
