<section class="autores-page admin-page">
  <div class="autores-page__layout admin-page__layout">
    @if (isAdmin() && selectedAutor()) {
      <div class="admin-modal" role="dialog" aria-modal="true" aria-label="Detalle de autor">
        <button
          class="admin-modal__backdrop"
          type="button"
          (click)="onCancelEdit()"
          aria-label="Cerrar"
        ></button>
        <aside class="autores-page__form-column admin-modal__dialog admin-modal__dialog--wide">
          <app-autor-form
            [autor]="selectedAutor()"
            [isSaving]="isSaving()"
            [isDeleting]="isDeleting()"
            [isCreating]="isCreating()"
            [errorMessage]="errorMessage()"
            [successMessage]="successMessage()"
            (save)="onSaveAutor($event)"
            (delete)="onDeleteAutor($event)"
            (cancel)="onCancelEdit()"
            (restoreAutor)="onRestore($event)"
          />
        </aside>
      </div>
    }

    <section class="autores-page__list-column admin-page__list">
      <app-autores-list
        [autores]="autores()"
        [selectedAutorId]="selectedAutor()?._id ?? null"
        [isLoading]="isLoading()"
        [isAdmin]="isAdmin()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectAutor)="onSelectAutor($event)"
        (createNew)="onCreateNew()"
        (pageChange)="onPageChange($event)"
        (nextPage)="onNextPage()"
        (previousPage)="onPreviousPage()"
        (search)="onSearch($event)"
      />
    </section>
  </div>
</section>
