<form class="reto-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-admin-editor
    eyebrow="Gestión de retos"
    [title]="formTitle"
    [subtitle]="formSubtitle"
    (closeEditor)="onCancel()"
  >
    <div adminEditorMessages>
      <div class="reto-form__alert reto-form__alert--error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
      <div class="reto-form__alert reto-form__alert--success" *ngIf="successMessage">
        {{ successMessage }}
      </div>
    </div>

    <ng-template adminEditorSection sectionId="general" label="General">
      <input type="hidden" formControlName="_id" />
      <input type="hidden" formControlName="activo" />

      <div class="reto-form__grid">
        <div class="reto-form__field">
          <label class="reto-form__label" for="retoId">ID de Mongo</label>
          <input
            id="retoId"
            class="reto-form__input reto-form__input--readonly"
            [value]="reto?._id || 'Se generará al crear el reto'"
            readonly
          />
        </div>

        <div class="reto-form__field">
          <span class="reto-form__label">Estado del reto</span>
          <span
            class="reto-form__record-status"
            [class.reto-form__record-status--inactive]="reto?.activo === false"
          >
            {{ reto?.activo === false ? 'Inactivo' : 'Activo' }}
          </span>
        </div>

        <div class="reto-form__field reto-form__field--full">
          <label class="reto-form__label" for="title">Título *</label>
          <input
            id="title"
            class="reto-form__input"
            formControlName="title"
            maxlength="150"
          />
        </div>

        <div class="reto-form__field reto-form__field--full">
          <label class="reto-form__label" for="description">Descripción *</label>
          <textarea
            id="description"
            class="reto-form__input"
            formControlName="description"
            rows="5"
            maxlength="1000"
          ></textarea>
        </div>

        <div class="reto-form__field">
          <label class="reto-form__label" for="type">Tipo de reto *</label>
          <select id="type" class="reto-form__input" formControlName="type">
            <option value="COMPRAR_LIBROS">Comprar libros</option>
            <option value="ALQUILAR_LIBROS">Alquilar libros</option>
            <option value="SEGUIR_USUARIOS">Seguir usuarios</option>
            <option value="RECIBIR_VALORACIONES">Recibir valoraciones</option>
            <option value="ASISTIR_EVENTOS">Asistir a eventos</option>
            <option value="SUBIR_LIBROS">Subir libros</option>
          </select>
        </div>

        <div class="reto-form__field">
          <label class="reto-form__label" for="objetivo">Objetivo *</label>
          <input
            id="objetivo"
            type="number"
            min="1"
            class="reto-form__input"
            formControlName="objetivo"
          />
          <span class="reto-form__hint" *ngIf="!isCreating">
            Cambiar el objetivo actualiza los progresos existentes de los usuarios.
          </span>
        </div>

        <div class="reto-form__field">
          <label class="reto-form__label" for="createdAt">Fecha de creación</label>
          <input
            id="createdAt"
            class="reto-form__input reto-form__input--readonly"
            [value]="formatDate(reto?.createdAt)"
            readonly
          />
        </div>

        <div class="reto-form__field">
          <label class="reto-form__label" for="updatedAt">Última actualización</label>
          <input
            id="updatedAt"
            class="reto-form__input reto-form__input--readonly"
            [value]="formatDate(reto?.updatedAt)"
            readonly
          />
        </div>
      </div>

      <p class="reto-form__error" *ngIf="form.touched && form.invalid">
        Revisa el título, la descripción, el tipo y el objetivo.
      </p>
    </ng-template>

    <div adminEditorActions class="reto-form__actions">
      <button
        type="button"
        class="reto-form__button reto-form__button--secondary"
        (click)="onCancel()"
        [disabled]="isSaving || isDeleting"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="reto-form__button reto-form__button--primary"
        [disabled]="isSaving || isDeleting"
      >
        {{ isSaving ? 'Guardando...' : isCreating ? 'Crear reto' : 'Guardar cambios' }}
      </button>
      <button
        type="button"
        class="reto-form__button reto-form__button--danger"
        *ngIf="!isCreating && reto?.activo"
        (click)="onDeactivate()"
        [disabled]="isSaving || isDeleting"
      >
        {{ isDeleting ? 'Desactivando...' : 'Desactivar reto' }}
      </button>
      <button
        type="button"
        class="reto-form__button reto-form__button--success"
        *ngIf="!isCreating && reto?.activo === false"
        (click)="onActivate()"
        [disabled]="isSaving || isDeleting"
      >
        {{ isDeleting ? 'Activando...' : 'Activar reto' }}
      </button>
    </div>
  </app-admin-editor>
</form>
