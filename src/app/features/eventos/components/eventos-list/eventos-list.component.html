<app-admin-list
  title="Eventos"
  itemLabel="eventos"
  emptyMessage="No hay eventos que coincidan con la búsqueda."
  searchPlaceholder="Buscar eventos..."
  [searchFields]="searchFields"
  initialSearchField="title"
  [isLoading]="isLoading"
  [canCreate]="isAdmin"
  createLabel="Nuevo evento"
  [visibleItems]="eventos.length"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  (queryChange)="queryChange.emit($event)"
  (createNew)="createNew.emit()"
>
  <div adminListHeader class="eventos-list__grid eventos-list__header">
    <span>Evento</span>
    <span>Fecha</span>
    <span>Dirección</span>
    <span>ID de MongoDB</span>
    <span>Estado administrativo</span>
    <span class="eventos-list__actions-heading">Acciones</span>
  </div>

  <div adminListRows>
    <article
      *ngFor="let evento of eventos; trackBy: trackByEventoId"
      class="eventos-list__grid eventos-list__row"
      [class.eventos-list__row--selected]="evento._id === selectedId"
      [class.eventos-list__row--deleted]="evento.IsDeleted"
      tabindex="0"
      role="button"
      (click)="onSelect(evento)"
      (keydown)="onRowKeydown($event, evento)"
    >
      <strong class="eventos-list__title">{{ evento.title || 'Sin título' }}</strong>
      <time class="eventos-list__cell" data-label="Fecha" [attr.datetime]="evento.eventDate">
        {{ evento.eventDate | date: 'dd/MM/yyyy HH:mm' }}
      </time>
      <span class="eventos-list__cell" data-label="Dirección">
        {{ evento.direccionExacta || '-' }}
      </span>
      <code class="eventos-list__id" data-label="ID">{{ evento._id || '-' }}</code>

      <span class="eventos-list__status" [class.eventos-list__status--deleted]="evento.IsDeleted">
        {{ evento.IsDeleted ? 'Desactivado' : 'Activo' }}
      </span>

      <button
        *ngIf="isAdmin"
        type="button"
        class="eventos-list__delete"
        title="Eliminar evento definitivamente"
        aria-label="Eliminar evento definitivamente"
        (click)="onPermanentDelete($event, evento)"
      >
        Eliminar
      </button>
    </article>
  </div>
</app-admin-list>
