<app-admin-list
  title="Usuarios"
  itemLabel="usuarios"
  emptyMessage="No hay usuarios que coincidan con la búsqueda."
  searchPlaceholder="Buscar usuarios..."
  [searchFields]="searchFields"
  initialSearchField="name"
  [isLoading]="isLoading"
  [canCreate]="isAdmin"
  createLabel="Nuevo usuario"
  [visibleItems]="usuarios.length"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  (queryChange)="queryChange.emit($event)"
  (createNew)="createNew.emit()"
>
  <div adminListHeader class="usuarios-list__grid usuarios-list__header">
    <span>Usuario</span>
    <span>Email</span>
    <span>Rol</span>
    <span>ID de MongoDB</span>
    <span>Estado administrativo</span>
    <span class="usuarios-list__actions-heading">Acciones</span>
  </div>

  <div adminListRows>
    <article
      *ngFor="let usuario of usuarios; trackBy: trackByUsuarioId"
      class="usuarios-list__grid usuarios-list__row"
      [class.usuarios-list__row--selected]="isSelected(usuario)"
      [class.usuarios-list__row--deleted]="usuario.IsDeleted"
      tabindex="0"
      role="button"
      (click)="onSelect(usuario)"
      (keydown)="onRowKeydown($event, usuario)"
    >
      <div class="usuarios-list__identity">
        <span class="usuarios-list__avatar">{{ (usuario.name || '?').charAt(0) }}</span>
        <strong>{{ usuario.name || 'Sin nombre' }}</strong>
      </div>

      <span class="usuarios-list__cell" data-label="Email">{{ usuario.email || '-' }}</span>
      <span class="usuarios-list__cell" data-label="Rol">{{ usuario.rol || '-' }}</span>
      <code class="usuarios-list__id" data-label="ID">{{ usuario._id || '-' }}</code>

      <span
        class="usuarios-list__status"
        [class.usuarios-list__status--deleted]="usuario.IsDeleted"
      >
        {{ usuario.IsDeleted ? 'Desactivado' : 'Activo' }}
      </span>

      <button
        *ngIf="isAdmin"
        type="button"
        class="usuarios-list__delete"
        title="Eliminar usuario definitivamente"
        aria-label="Eliminar usuario definitivamente"
        (click)="onPermanentDelete($event, usuario)"
      >
        Eliminar
      </button>
    </article>
  </div>
</app-admin-list>
