<section class="usuarios-page admin-page">
  <div class="usuarios-page__layout admin-page__layout">
    <div
      class="admin-modal"
      *ngIf="isAdmin() && selectedUsuario()"
      role="dialog"
      aria-modal="true"
      aria-label="Detalle de usuario"
    >
      <button
        class="admin-modal__backdrop"
        type="button"
        (click)="onCancelEdit()"
        aria-label="Cerrar"
      ></button>
      <aside class="usuarios-page__form-column admin-modal__dialog admin-modal__dialog--wide">
        <app-usuario-form
          [usuario]="selectedUsuario()"
          [isSaving]="isSaving()"
          [isDeleting]="isDeleting()"
          [isCreating]="isCreating()"
          [errorMessage]="errorMessage()"
          [successMessage]="successMessage()"
          (save)="onSaveUsuario($event)"
          (delete)="onDeleteUsuario($event)"
          (cancel)="onCancelEdit()"
          (restoreUsuario)="onRestore($event)"
        />
      </aside>
    </div>

    <section class="usuarios-page__list-column admin-page__list">
      <app-usuarios-list
        [usuarios]="usuarios()"
        [selectedUsuarioId]="selectedUsuario()?._id ?? null"
        [isLoading]="isLoading()"
        [isAdmin]="isAdmin()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectUsuario)="onSelectUsuario($event)"
        (createNew)="onCreateNew()"
        (queryChange)="onListQuery($event)"
        (permanentDelete)="onPermanentDelete($event)"
      />
    </section>
  </div>
</section>
