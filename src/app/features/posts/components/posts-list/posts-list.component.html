<app-admin-list
  title="Posts"
  itemLabel="posts"
  emptyMessage="No hay posts que coincidan con la búsqueda."
  searchPlaceholder="Buscar posts..."
  [searchFields]="searchFields"
  initialSearchField="book"
  [isLoading]="isLoading"
  [canCreate]="isAdmin"
  createLabel="Nuevo post"
  [visibleItems]="posts.length"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  (queryChange)="queryChange.emit($event)"
  (createNew)="createNew.emit()"
>
  <div adminListHeader class="posts-list__grid posts-list__header">
    <span>Libro</span>
    <span>Propietario</span>
    <span>Precio</span>
    <span>Estado</span>
    <span>ID de MongoDB</span>
    <span>Estado administrativo</span>
    <span class="posts-list__actions-heading">Acciones</span>
  </div>

  <div adminListRows>
    <article
      *ngFor="let post of posts; trackBy: trackByPostId"
      class="posts-list__grid posts-list__row"
      [class.posts-list__row--selected]="post._id === selectedId"
      [class.posts-list__row--deleted]="post.IsDeleted"
      tabindex="0"
      role="button"
      (click)="onSelect(post)"
      (keydown)="onRowKeydown($event, post)"
    >
      <strong class="posts-list__book">{{ book(post) }}</strong>
      <span class="posts-list__cell" data-label="Propietario">{{ owner(post) }}</span>
      <span class="posts-list__cell" data-label="Precio">
        {{ post.price | number: '1.2-2' }} €
      </span>
      <span class="posts-list__publication-status" data-label="Estado">{{ post.status }}</span>
      <code class="posts-list__id" data-label="ID">{{ post._id || '-' }}</code>
      <span
        class="posts-list__admin-status"
        [class.posts-list__admin-status--deleted]="post.IsDeleted"
      >
        {{ post.IsDeleted ? 'Desactivado' : 'Activo' }}
      </span>
      <button
        *ngIf="isAdmin"
        type="button"
        class="posts-list__delete"
        title="Eliminar post definitivamente"
        aria-label="Eliminar post definitivamente"
        (click)="onPermanentDelete($event, post)"
      >
        Eliminar
      </button>
    </article>
  </div>
</app-admin-list>
