<section class="posts-page admin-page">
  <div class="posts-page__layout admin-page__layout">
    <div
      class="admin-modal"
      *ngIf="selectedPost()"
      role="dialog"
      aria-modal="true"
      aria-label="Detalle de post"
    >
      <button
        class="admin-modal__backdrop"
        type="button"
        (click)="onCancel()"
        aria-label="Cerrar"
      ></button>
      <aside class="posts-page__form-column admin-modal__dialog admin-modal__dialog--wide">
        <app-post-form
          [post]="selectedPost()"
          [libros]="libros()"
          [usuarios]="usuarios()"
          [isLoadingRelations]="isLoadingRelations()"
          [isSaving]="isSaving()"
          [isDeleting]="isDeleting()"
          [isCreating]="isCreating()"
          [errorMessage]="errorMessage()"
          [successMessage]="successMessage()"
          (save)="onSave($event)"
          (delete)="onDelete($event)"
          (restore)="onRestore($event)"
          (cancel)="onCancel()"
        />
      </aside>
    </div>

    <section class="posts-page__list-column admin-page__list">
      <app-posts-list
        [posts]="posts()"
        [selectedId]="selectedPost()?._id ?? null"
        [isLoading]="isLoading()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectPost)="onSelect($event)"
        (createNew)="onCreateNew()"
        (search)="onSearch($event)"
        (pageChange)="onPageChange($event)"
      />
    </section>
  </div>
</section>
