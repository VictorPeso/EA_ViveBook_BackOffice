<section class="posts-page">
  <div class="posts-page__layout">
    <aside class="posts-page__form-column">
      <app-post-form
        [post]="selectedPost()"
        [libros]="libros()"
        [usuarios]="usuarios()"
        [isLoadingRelations]="isLoadingRelations()"
        [isSaving]="isSaving()"
        [isDeleting]="isDeleting()"
        [isCreating]="isCreating()"
        [errorMessage]="errorMessage()"
        [successMessage]="successMessage()"
        (save)="onSave($event)"
        (delete)="onDelete($event)"
        (restore)="onRestore($event)"
        (cancel)="onCancel()"
      />
    </aside>
    <section class="posts-page__list-column">
      <app-posts-list
        [posts]="posts()"
        [selectedId]="selectedPost()?._id ?? null"
        [isLoading]="isLoading()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectPost)="onSelect($event)"
        (createNew)="onCreateNew()"
        (search)="onSearch($event)"
        (pageChange)="onPageChange($event)"
      />
    </section>
  </div>
</section>
