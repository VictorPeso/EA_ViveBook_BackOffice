<section class="librerias-page admin-page">
  <div class="librerias-page__layout admin-page__layout">
    <div
      class="admin-modal"
      *ngIf="selectedLibreria()"
      role="dialog"
      aria-modal="true"
      aria-label="Detalle de librería"
    >
      <button
        class="admin-modal__backdrop"
        type="button"
        (click)="onCancel()"
        aria-label="Cerrar"
      ></button>
      <aside class="librerias-page__form-column admin-modal__dialog admin-modal__dialog--wide">
        <app-libreria-form
          [libreria]="selectedLibreria()"
          [isSaving]="isSaving()"
          [isDeleting]="isDeleting()"
          [isCreating]="isCreating()"
          [errorMessage]="errorMessage()"
          [successMessage]="successMessage()"
          (save)="onSave($event)"
          (delete)="onDelete($event)"
          (restore)="onRestore($event)"
          (cancel)="onCancel()"
        />
      </aside>
    </div>

    <section class="librerias-page__list-column admin-page__list">
      <app-librerias-list
        [librerias]="librerias()"
        [selectedId]="selectedLibreria()?._id ?? null"
        [isLoading]="isLoading()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectLibreria)="onSelect($event)"
        (createNew)="onCreateNew()"
        (search)="onSearch($event)"
        (pageChange)="onPageChange($event)"
      />
    </section>
  </div>
</section>
