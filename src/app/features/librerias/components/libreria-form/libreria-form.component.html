<section class="libreria-form">
  <header>
    <p>Formulario</p>
    <h2>{{ isCreating ? 'Nueva librería' : 'Editar librería' }}</h2>
  </header>
  <div class="alert error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="alert success" *ngIf="successMessage">{{ successMessage }}</div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Nombre
      <input formControlName="name" placeholder="Nombre de la librería" />
    </label>
    <p class="validation" *ngIf="form.controls.name.touched && form.controls.name.invalid">
      El nombre es obligatorio.
    </p>
    <label>
      Dirección
      <textarea formControlName="address" rows="3" placeholder="Dirección completa"></textarea>
    </label>
    <p class="validation" *ngIf="form.controls.address.touched && form.controls.address.invalid">
      La dirección es obligatoria.
    </p>
    <div class="actions">
      <button type="button" class="secondary" (click)="cancel.emit()">Cancelar</button>
      <button type="submit" class="primary" [disabled]="isSaving || isDeleting">
        {{ isSaving ? 'Guardando...' : isCreating ? 'Crear librería' : 'Guardar cambios' }}
      </button>
      <button
        type="button"
        class="danger"
        *ngIf="!isCreating && !libreria?.IsDeleted"
        (click)="onDelete()"
      >
        Desactivar
      </button>
      <button
        type="button"
        class="success-button"
        *ngIf="!isCreating && libreria?.IsDeleted"
        (click)="onRestore()"
      >
        Restaurar
      </button>
    </div>
  </form>
</section>
