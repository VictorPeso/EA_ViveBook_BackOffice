<section class="libros-page admin-page">
  <div class="libros-page__layout admin-page__layout">
    @if (isAdmin() && selectedLibro()) {
      <div class="admin-modal" role="dialog" aria-modal="true" aria-label="Detalle de libro">
        <button
          class="admin-modal__backdrop"
          type="button"
          (click)="onCancelEdit()"
          aria-label="Cerrar"
        ></button>
        <aside class="libros-page__form-column admin-modal__dialog admin-modal__dialog--wide">
          <app-libro-form
            [libro]="selectedLibro()"
            [isSaving]="isSaving()"
            [isDeleting]="isDeleting()"
            [isCreating]="isCreating()"
            [errorMessage]="errorMessage()"
            [successMessage]="successMessage()"
            (save)="onSaveLibro($event)"
            (delete)="onDeleteLibro($event)"
            (cancel)="onCancelEdit()"
            (restoreLibro)="onRestore($event)"
          />
        </aside>
      </div>
    }

    <section class="libros-page__list-column admin-page__list">
      <app-libros-list
        [libros]="libros()"
        [selectedLibroId]="selectedLibro()?._id ?? null"
        [isLoading]="isLoading()"
        [isAdmin]="isAdmin()"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalItems]="totalItems()"
        [pageSize]="pageSize()"
        (selectLibro)="onSelectLibro($event)"
        (createNew)="onCreateNew()"
        (pageChange)="onPageChange($event)"
        (nextPage)="onNextPage()"
        (previousPage)="onPreviousPage()"
        (search)="onSearch($event)"
      />
    </section>
  </div>
  <app-toast />
</section>
