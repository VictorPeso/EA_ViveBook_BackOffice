<app-admin-list
  title="Libros"
  itemLabel="libros"
  emptyMessage="No hay libros que coincidan con la búsqueda."
  searchPlaceholder="Buscar libros..."
  [searchFields]="searchFields"
  initialSearchField="title"
  [isLoading]="isLoading"
  [canCreate]="isAdmin"
  createLabel="Nuevo libro"
  [visibleItems]="libros.length"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalItems]="totalItems"
  [pageSize]="pageSize"
  (queryChange)="queryChange.emit($event)"
  (createNew)="createNew.emit()"
>
  <div adminListHeader class="libros-list__grid libros-list__header">
    <span>Libro</span>
    <span>Autor</span>
    <span>ISBN</span>
    <span>Tipo</span>
    <span>ID de MongoDB</span>
    <span>Estado administrativo</span>
    <span class="libros-list__actions-heading">Acciones</span>
  </div>

  <div adminListRows>
    <article
      *ngFor="let libro of libros; trackBy: trackByLibroId"
      class="libros-list__grid libros-list__row"
      [class.libros-list__row--selected]="isSelected(libro)"
      [class.libros-list__row--deleted]="libro.IsDeleted"
      tabindex="0"
      role="button"
      (click)="onSelect(libro)"
      (keydown)="onRowKeydown($event, libro)"
    >
      <strong class="libros-list__title">{{ libro.title || 'Sin título' }}</strong>
      <span class="libros-list__cell" data-label="Autor">{{ getAuthorsDisplay(libro) }}</span>
      <span class="libros-list__cell" data-label="ISBN">{{ libro.isbn || '-' }}</span>
      <span class="libros-list__type" data-label="Tipo">{{ libro.type || '-' }}</span>
      <code class="libros-list__id" data-label="ID">{{ libro._id || '-' }}</code>

      <span class="libros-list__status" [class.libros-list__status--deleted]="libro.IsDeleted">
        {{ libro.IsDeleted ? 'Desactivado' : 'Activo' }}
      </span>

      <button
        *ngIf="isAdmin"
        type="button"
        class="libros-list__delete"
        title="Eliminar libro definitivamente"
        aria-label="Eliminar libro definitivamente"
        (click)="onPermanentDelete($event, libro)"
      >
        Eliminar
      </button>
    </article>
  </div>
</app-admin-list>
